name: desktop

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
    inputs:
      gate_probe:
        description: 'Verify a failing gate (expected failed run; never publishes artifacts)'
        type: choice
        default: none
        options: [none, frontend, rust, compile]

permissions:
  contents: read

jobs:
  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 45
    # #102：第三方与官方 action 全部按 commit SHA 固定（`@vN` 浮标签会被上游一次
    # force-push 静默换掉代码，而 workflow 有 contents:read 与云端缓存权限）。
    # 版本语义写在行尾注释里，升级时只改 SHA + 注释。test/run.mjs 的 [27] 段守住这条。
    defaults:
      run:
        shell: pwsh
    env:
      # Deliberately empty project dependency cache: exercise the documented first build.
      CARGO_HOME: ${{ github.workspace }}/.ci-cargo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install repository Rust toolchain
        run: rustup show active-toolchain
      - name: Prepare locked frontend dependencies
        run: npm ci --prefix desktop
      - name: Prepare locked Rust dependencies
        run: cargo fetch --locked --manifest-path desktop/src-tauri/Cargo.toml
      - name: Inject frontend failure for gate verification
        if: github.event_name == 'workflow_dispatch' && inputs.gate_probe == 'frontend'
        run: Set-Content desktop/src/gate-probe.test.ts "import { test, expect } from 'vitest'; test('intentional gate probe', () => expect(true).toBe(false));"
      - name: Inject Rust failure for gate verification
        if: github.event_name == 'workflow_dispatch' && inputs.gate_probe == 'rust'
        run: Set-Content desktop/src-tauri/tests/gate_probe.rs '#[test] fn intentional_gate_probe() { panic!("intentional gate probe"); }'
      - name: Inject compile failure for gate verification
        if: github.event_name == 'workflow_dispatch' && inputs.gate_probe == 'compile'
        run: Add-Content desktop/src-tauri/src/lib.rs 'compile_error!("intentional gate probe");'
      - name: Desktop frontend tests
        run: npm test --prefix desktop
      - name: Desktop frontend build
        run: npm run build --prefix desktop
      - name: Desktop Rust tests
        run: cargo test --offline --locked --tests --manifest-path desktop/src-tauri/Cargo.toml
      - name: 100k and 1m indexed paging regression
        run: cargo test --offline --locked --manifest-path desktop/src-tauri/Cargo.toml --test query_scale -- --ignored --nocapture
      - name: Build and package embedded desktop
        run: pwsh -File desktop/scripts/build-windows.ps1
      - name: Verify package and licenses
        run: pwsh -File desktop/scripts/verify-package.ps1
      - name: Packaged service lifecycle smoke
        run: node desktop/scripts/service-smoke.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: TokenMonitor-desktop-windows-x64
          path: dist/TokenMonitor-desktop-windows-x64.zip
          if-no-files-found: error
