name: windows-source

on:
  # #102：路径过滤。此前没有 paths，改一行 README 也要跑完整个 Windows 原生矩阵
  # （两个 Node job + gui/tray 两次从零 cargo 编译）。下面列的是本文件真的会
  # 编译或执行的东西：windows/** 两个 crate（含各自的 Cargo.lock）、Node 侧
  # src/bin/web、被 npm test 与 verify-windows-source.ps1 读到的 test/scripts/
  # package*.json、以及被 gui/tray 套件自己断言的 rust-toolchain.toml。
  # 文档改动不会失去门：test.yml 的矩阵里就有 windows-latest 的 npm test，
  # 而读文档与读 workflow 文本的守卫（[26]/[27]/[28]）都跑在那里面。
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows.yml'
      - 'windows/**'
      - 'src/**'
      - 'bin/**'
      - 'web/**'
      - 'test/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'rust-toolchain.toml'
  pull_request:
    # 与上面 push 的清单保持一致（GitHub 不支持 YAML 锚点，所以这里只能照抄一份；
    # test/run.mjs 的 [27] 段会逐个 workflow 比对两个清单是否已经走岔）。
    paths:
      - '.github/workflows/windows.yml'
      - 'windows/**'
      - 'src/**'
      - 'bin/**'
      - 'web/**'
      - 'test/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'rust-toolchain.toml'
  # #102：允许手动重跑（只验证，不发布），改完门就能单独点一次看红绿
  workflow_dispatch:

# #102：显式声明最小权限。此前只有 desktop.yml 写了 permissions，另外两个 workflow
# 依赖组织级默认值——默认一旦放宽，这两个文件会静默拿到写仓库的 token。
permissions:
  contents: read

# Verification only. No secrets, no publish, no artifact upload of DBs/logs.
env:
  TOKENMONITOR_OFFLINE: '1'

jobs:
  windows-smoke:
    name: smoke Node ${{ matrix.node }}
    runs-on: windows-latest
    # #102：每个 job 都必须带 timeout-minutes。没有它，卡死（等端口、等子进程、等交互式
    # PowerShell）的 job 会一直挂在"运行中"，把本该是红的结果变成永远不出结果。
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13', '24']
    # 这两个 Node job 故意把仓库 checkout 到含空格的路径里：整套 Windows 支持的
    # 前提就是"路径含空格与中文不能炸"，这是它唯一的实机演练位。
    defaults:
      run:
        working-directory: 'Token Monitor'
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: 'Token Monitor'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: npm ci
        run: npm ci --omit=dev
      - name: import smoke
        run: node test/windows/ci-smoke.mjs
      - name: CLI help/version
        run: |
          node bin/tokenmonitor.js --help
          node bin/tokenmonitor.js --version
      - name: Chinese-path local verifier
        run: powershell -NoProfile -File scripts/verify-windows-source.ps1

  windows-npm-test:
    name: npm test Node ${{ matrix.node }}
    runs-on: windows-latest
    # #67 之后 npm test 会把 test/windows/ 的 12 个套件全部真跑（本机 +35s），留足余量
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13', '24']
    defaults:
      run:
        working-directory: 'Token Monitor'
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: 'Token Monitor'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: npm ci
        run: npm ci --omit=dev
      - name: npm test (failures reported as-is; no continue-on-error)
        run: npm test
        # Intentionally no continue-on-error. Baseline failures must fail the job.
        # #67：本 job 就是 test/windows/** 在 CI 里的覆盖证据，
        # test/run.mjs 的 [26] 段会解析本文件并在缺失时判红。

  # 原生 job 不再用含空格的 checkout 目录：这不是放松要求（空格/中文路径由
  # windows-smoke 这两个 job 负责演练，gui/tray 的套件自己还会把 exe 复制到
  # 含空格+中文的临时目录里跑），而是 #102 的缺陷本体——引号在这里不是装饰：
  # rust-cache 的 `workspaces` 输入是按**空白切分**成多个 workspace 根的（它期望
  # 的就是 `a b/c` 这种空格分隔列表），所以曾经那行
  # `workspaces: 'Token Monitor/windows/gui'` 会被切成
  # ["Token", "Monitor/windows/gui"] 两个都不存在的路径；YAML 层的引号在切分之前
  # 就已经被吃掉，起不到"这是一个含空格的路径"的作用。结果是缓存 key 永远命不中，
  # 每次 native job 都从零编译依赖——只是变慢，不会红，所以再也没人去修。
  # 现在这两个 job 用默认 checkout 路径（无空格），workspaces 写真实存在的
  # windows/gui 与 windows/tray。test/run.mjs 的 [27] 段守住三件事：workspaces
  # 不含空白、它指向真实目录、且使用它的那个 job 的 checkout `path:` /
  # working-directory 也不含空白（否则同样的错会以另一种形式回来）。
  windows-gui:
    name: rust gui build + behavior (#41)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # 工具链版本由仓库根 rust-toolchain.toml 固定（rustup 自动读取）
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Cache cargo registry and gui target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: windows/gui
      - name: cargo build --release (zero-warning gate, warnings denied via RUSTFLAGS)
        env:
          RUSTFLAGS: '-Dwarnings'
        run: cargo build --release --manifest-path windows/gui/Cargo.toml
      - name: Build publish artifact
        run: powershell -NoProfile -ExecutionPolicy Bypass -File windows/gui/build.ps1
      - name: gui behavioral tests (artifact missing = hard fail; no skip-green)
        env:
          TOKENMONITOR_OFFLINE: '1'
        run: node test/windows/gui.test.mjs

  # #90：windows/tray 此前在 CI 里完全没有 job——托盘的行为断言（单实例互斥、
  # 中文+空格路径下运行、退出无残留）与 .NET 工程不得复活的源码契约，只有本地手动跑过。
  # 结构与 windows-gui 一致：先零告警构建，再 build.ps1 产出 publish/，最后行为测试。
  # 缺产物时 tray.test.mjs 自身 exit 1（不接受隐式跳过），所以这个 job 是真的能红的门。
  windows-tray:
    name: rust tray build + behavior (#9/#32)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Cache cargo registry and tray target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: windows/tray
      - name: cargo build --release (zero-warning gate, warnings denied via RUSTFLAGS)
        env:
          RUSTFLAGS: '-Dwarnings'
        run: cargo build --release --manifest-path windows/tray/Cargo.toml
      - name: Build publish artifact
        run: powershell -NoProfile -ExecutionPolicy Bypass -File windows/tray/build.ps1
      - name: tray behavioral tests (artifact missing = hard fail; no skip-green)
        env:
          TOKENMONITOR_OFFLINE: '1'
        run: node test/windows/tray.test.mjs
