[package]
name = "tokenmonitor-desktop"
version = "2.1.0"
edition = "2021"
license = "MIT"
default-run = "TokenMonitor"

[lib]
name = "tokenmonitor_core"
path = "src/lib.rs"

[[bin]]
name = "TokenMonitor"
path = "src/main.rs"

[features]
default = ["desktop", "custom-protocol"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin-autostart"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
rusqlite = { version = "0.32", features = ["bundled", "functions", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
uuid = { version = "1", features = ["v4"] }
zstd = "0.13"
percent-encoding = "2"
aes-gcm = "0.10.3"
base64 = "0.22"
sha2 = "0.10"
regex = "1"
rust_xlsxwriter = "0.94.1"
tauri = { version = "2", features = ["tray-icon", "image-png"], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-autostart = { version = "2", optional = true }
chrono-tz = "0.10"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = "s"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
