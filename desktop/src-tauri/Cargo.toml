[package]
name = "tokenmonitor-desktop"
version = "2.0.0"
edition = "2021"
# #102：MSRV 声明。取的是"代码与依赖真的要求多少"，不是 rust-toolchain.toml 钉的
# 那个 channel（照抄钉住的版本等于把升级工具链和抬高下限这两件无关的事绑在一起，
# 而且永远说不清下限到底是被谁顶上去的）。查证结果：
#   - 本 crate 自己的代码：File::try_lock / File::lock（src/main.rs 的 desktop.lock、
#     src/service.rs 的 service.lock）走的 std::fs::FileLock，标准库里的稳定标记是
#     since = "1.89.0"；Option::is_none_or（src/model.rs 的查询过滤）是 1.82。
#   - 依赖闭包（当前 Cargo.lock）里声明的 rust-version 最高为 1.88
#     （time / image / plist / serde_with / icu_* 这一批）。
# 取两者最大值 → 1.89。windows/gui 与 windows/tray 是另一条线（只要 1.70，
# 它们不用这些 API），三条线各自声明，互不牵连。
rust-version = "1.89"
license = "MIT"
default-run = "TokenMonitor"

[lib]
name = "tokenmonitor_core"
path = "src/lib.rs"

[[bin]]
name = "TokenMonitor"
path = "src/main.rs"

[features]
default = ["desktop", "custom-protocol"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin-autostart"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
# `functions` backs the `tm_lower`/`tm_project` scalar functions registered in db.rs.
# `hooks` is not dead either: tests/query_scale.rs instruments wide-range paging through
# `Connection::progress_handler`, and dropping the feature fails to compile with E0599.
rusqlite = { version = "0.32", features = ["bundled", "functions", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
uuid = { version = "1", features = ["v4"] }
zstd = "0.13"
percent-encoding = "2"
rust_xlsxwriter = "0.94.1"
tauri = { version = "2", features = ["tray-icon", "image-png"], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-autostart = { version = "2", optional = true }
chrono-tz = "0.10"

[dev-dependencies]
# #82：解包级校验 xlsx 导出内容。与 rust_xlsxwriter 0.94.1 的传递依赖同版本
# 同特性（zip 7.2 / deflate），不引入新的 crate 下载，--locked 直接通过。
zip = { version = "7.2", default-features = false, features = ["deflate"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = "s"
