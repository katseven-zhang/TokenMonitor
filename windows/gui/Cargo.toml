[package]
name = "TokenMonitorGui"
version = "1.4.3"
edition = "2021"
# #102：MSRV 声明。以前三个 crate 都不写 rust-version，"能用的最低版本"只存在于
# rust-toolchain.toml 钉住的那个 channel 里——那把整个仓库的实际要求等同于
# "作者机器上的工具链"，而真正的下限远低于它：老工具链的用户拿不到任何
# "这个 API 从 1.70 起才有"的提示，只会看到一个陌生的 feature gate 错误。
# 1.70 是本 crate 真正用到的最新标准库 API：std::sync::OnceLock（WSA 启动的一次性
# 初始化，src/main.rs 的 WSA_STARTED；标准库里它的稳定标记是 since = "1.70.0"）。
# 依赖闭包里最高的 rust-version 声明只有 windows-sys 0.59 的 1.60。
# 与 desktop/src-tauri 的 rust-version 不同是有意为之：那条线用到 File::try_lock，
# 且依赖 time/image 等新 crate，要求更高（见该文件的注释）。
rust-version = "1.70"
description = "TokenMonitor 图形启动器：启动/停止后台、端口设置、输出日志查看（原生 Win32，目标机零依赖）"

[[bin]]
name = "TokenMonitorGui"
path = "src/main.rs"

[dependencies]
# 官方 Win32 API 绑定（仅编译期使用；运行期只链接系统自带的 user32/gdi32 等）
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Networking_WinSock",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Controls",
  "Win32_Security",
  "Win32_Storage_FileSystem",
] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
