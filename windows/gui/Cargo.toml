[package]
name = "TokenMonitorGui"
version = "1.4.3"
edition = "2021"
description = "TokenMonitor 图形启动器：启动/停止后台、端口设置、输出日志查看（原生 Win32，目标机零依赖）"

[[bin]]
name = "TokenMonitorGui"
path = "src/main.rs"

[dependencies]
# 官方 Win32 API 绑定（仅编译期使用；运行期只链接系统自带的 user32/gdi32 等）
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Networking_WinSock",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Controls",
  "Win32_Security",
  "Win32_Storage_FileSystem",
] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
